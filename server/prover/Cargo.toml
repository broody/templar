[package]
name = "templar-prover"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Templar prover server: the job API, pre-checks (the compiled bridge), sandboxed OS runs and large proofs (docs/prover-server-spec.md)"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
starknet-types-core = { version = "=0.2.4", default-features = false, features = ["std", "hash", "serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "fs", "time", "sync", "signal"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
debug = false

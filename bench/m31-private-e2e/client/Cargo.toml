[package]
name = "templar-private-membership"
version = "0.1.0"
edition = "2024"

[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
stwo = { path = "../../../target/m31-append/stwo/crates/stwo", features = ["prover"] }
num-traits = "0.2.19"
rand = "=0.8.8"
sha3 = "=0.10.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "0.2"

[profile.release]
debug = false

[package]
name = "pool"
version = "0.1.0"
edition = "2024_07"
description = "TemplarPool v2 — trustless private pool (spec: docs/pool-v2-spec.md)"

[dependencies]
starknet = "2.18.0"
ekubo_swap_anonymizer = { git = "https://github.com/starkware-libs/starknet-privacy", rev = "b40bf109c8e5b97d9d6e8ec6db48b16b9d10a106" }
vesu_lending_anonymizer = { git = "https://github.com/starkware-libs/starknet-privacy", rev = "b40bf109c8e5b97d9d6e8ec6db48b16b9d10a106", features = ["test_utils"] }

[dev-dependencies]
snforge_std = "0.63.0"
assert_macros = "2.18.0"

[scripts]
test = "snforge test"

[[target.starknet-contract]]
sierra = true
casm = true
build-external-contracts = [
    "ekubo_swap_anonymizer::ekubo_swap_anonymizer::EkuboSwapAnonymizer",
    "vesu_lending_anonymizer::vesu_lending_anonymizer::VesuLendingAnonymizer",
    "vesu_lending_anonymizer::test_utils_contracts::mock_vesu_vault::MockVesuVault",
]

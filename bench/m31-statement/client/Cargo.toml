[package]
name = "templar-m31-statement"
version = "0.1.0"
edition = "2024"
default-run = "templar-m31-statement"

[lib]
crate-type = ["rlib"]

[workspace]

[dependencies]
stwo = { path = "../../../target/m31-append/stwo/crates/stwo", features = ["prover", "parallel"] }
stwo-constraint-framework = { path = "../../../target/m31-append/stwo/crates/constraint-framework", features = ["prover", "parallel"] }
cairo-air = { path = "../../../target/m31-append/stwo-cairo/stwo_cairo_prover/crates/cairo-air" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-traits = "0.2.19"
bincode = "1.3"
anyhow = "1"
rayon = "=1.12.0"
num-bigint = "0.4"
rand = "=0.8.8"
stwo-cairo-serialize = { path = "../../../target/m31-append/stwo-cairo/stwo_cairo_prover/crates/cairo-serialize" }
starknet-types-core = { version = "=0.2.4", features = ["hash", "serde"] }

[patch."https://github.com/starkware-libs/stwo"]
stwo = { path = "../../../target/m31-append/stwo/crates/stwo" }
stwo-constraint-framework = { path = "../../../target/m31-append/stwo/crates/constraint-framework" }

[patch."https://github.com/starkware-libs/stwo-cairo"]
cairo-air = { path = "../../../target/m31-append/stwo-cairo/stwo_cairo_prover/crates/cairo-air" }
stwo-cairo-serialize = { path = "../../../target/m31-append/stwo-cairo/stwo_cairo_prover/crates/cairo-serialize" }

[profile.release]
debug = false

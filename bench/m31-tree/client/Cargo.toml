[package]
name = "templar-m31-tree"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]

[dependencies]
stwo = { path = "../../../target/m31-tree/stwo/crates/stwo", features = ["prover", "parallel"] }
stwo-constraint-framework = { path = "../../../target/m31-tree/stwo/crates/constraint-framework", features = ["prover", "parallel"] }
stwo-cairo-prover = { path = "../../../target/m31-tree/stwo-cairo/stwo_cairo_prover/crates/prover" }
stwo-cairo-adapter = { path = "../../../target/m31-tree/stwo-cairo/stwo_cairo_prover/crates/adapter" }
stwo-cairo-common = { path = "../../../target/m31-tree/stwo-cairo/stwo_cairo_prover/crates/common", features = ["prover"] }
cairo-air = { path = "../../../target/m31-tree/stwo-cairo/stwo_cairo_prover/crates/cairo-air" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-traits = "0.2.19"
bincode = "1.3"
anyhow = "1"
rayon = "=1.12.0"
starknet-types-core = { version = "=0.2.4", features = ["hash", "serde"] }

[patch."https://github.com/starkware-libs/stwo"]
stwo = { path = "../../../target/m31-tree/stwo/crates/stwo" }
stwo-constraint-framework = { path = "../../../target/m31-tree/stwo/crates/constraint-framework" }
stwo-air-utils = { path = "../../../target/m31-tree/stwo/crates/air-utils" }
stwo-air-utils-derive = { path = "../../../target/m31-tree/stwo/crates/air-utils-derive" }

[patch."https://github.com/starkware-libs/stwo-cairo"]
cairo-air = { path = "../../../target/m31-tree/stwo-cairo/stwo_cairo_prover/crates/cairo-air" }
stwo-cairo-prover = { path = "../../../target/m31-tree/stwo-cairo/stwo_cairo_prover/crates/prover" }
stwo-cairo-common = { path = "../../../target/m31-tree/stwo-cairo/stwo_cairo_prover/crates/common" }
stwo-cairo-utils = { path = "../../../target/m31-tree/stwo-cairo/stwo_cairo_prover/crates/utils" }
stwo-cairo-serialize = { path = "../../../target/m31-tree/stwo-cairo/stwo_cairo_prover/crates/cairo-serialize" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.128"

[profile.release]
debug = false

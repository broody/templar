[package]
name = "templar-stock-hiding"
version = "0.1.0"
edition = "2024"
description = "H2 check against unmodified upstream proving@5a7c5ed (target/proving-main), full profile"

[workspace]

[dependencies]
circuits = { path = "../../../target/proving-main/crates/circuits" }
circuit-common = { path = "../../../target/proving-main/crates/circuit_common", features = ["prover"] }
circuit-prover = { path = "../../../target/proving-main/crates/circuit_prover" }
circuit-verifier = { path = "../../../target/proving-main/crates/circuit_verifier" }
stwo = { path = "../../../target/proving-main/crates/stwo", features = ["prover", "parallel"] }
serde_json = "1"
rand = "=0.8.8"

[profile.release]
debug = false

[package]
name = "templar-client-verifier-circuit"
version = "0.1.0"
edition = "2024"

[workspace]

[lib]
path = "src/lib.rs"

[dependencies]
circuits = { path = "../../../target/proving-arith/crates/circuits" }
circuit-common = { path = "../../../target/proving-arith/crates/circuit_common", features = ["prover"] }
circuit-prover = { path = "../../../target/proving-arith/crates/circuit_prover" }
circuit-verifier = { path = "../../../target/proving-arith/crates/circuit_verifier" }
circuit-cairo-serialize = { path = "../../../target/proving-arith/crates/circuit_cairo_serialize" }
stwo = { path = "../../../target/proving-arith/crates/stwo", features = ["prover", "parallel"] }
stwo-constraint-framework = { path = "../../../target/proving-arith/crates/constraint-framework", features = ["prover", "parallel"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-traits = "0.2.19"
blake2 = "=0.10.6"
rand = "=0.8.8"
templar-private-membership = { path = "oracle" }
anyhow = "1"
starknet-ff = "0.3"
stwo-cairo-serialize = { path = "../../../target/proving-arith/crates/cairo-serialize" }

[features]
# Test-only hint overrides (`policy::TAMPER`, `payment4::TAMPER`, `payment::CARRIES`) for malicious-witness tests.
# Production builds never read them.
tamper = []

[[test]]
name = "policy_p1_malicious"
required-features = ["tamper"]

[[test]]
name = "payment_r4_malicious"
required-features = ["tamper"]

[profile.release]
debug = false

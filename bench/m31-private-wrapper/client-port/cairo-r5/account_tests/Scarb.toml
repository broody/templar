# snforge tests of the R0 V5 statement account on real client proofs, with mock bound accounts
# (docs/account-bound-note-spec.md §5.4, §15 P3). Run in a built work directory after
# `node kat/gen_fixtures.cjs WORK PROOFS` has written fixtures/: `snforge test` from here.
[package]
name = "templar_account_tests"
version = "0.1.0"
edition = "2024_07"

# The lib target lets pool_e2e deploy `MockAccount` as an external contract.
[lib]

[dependencies]
starknet = "2.18.0"
templar_membership_account = { path = "../account" }

[dev-dependencies]
snforge_std = "0.63.0"
assert_macros = "2.18.0"

[[target.starknet-contract]]
sierra = true
casm = true
build-external-contracts = ["templar_membership_account::PaymentVerifierAccount"]

[scripts]
test = "snforge test"

# The real-wallet tests (#[ignore], tests/test_real_wallets.cairo) read account state from the
# local Sepolia node; nothing is sent.
[[tool.snforge.fork]]
name = "SEPOLIA"
url = "http://127.0.0.1:9545/rpc/v0_10"
block_id.number = "15637581"

[package]
name = "templar-proof2-hiding"
version = "0.1.0"
edition = "2024"
description = "H2/H4 on PROOF2's leaf-verifier circuit, as the prover server pins it (broody/proving@b54ed94f, target/proving-server). Private."

[workspace]

# Cargo.lock is seeded from the pinned fork's lockfile.
[dependencies]
leaf-prover = { path = "../../../target/proving-server/crates/leaf_prover" }
privacy-circuit-verify = { path = "../../../target/proving-server/crates/privacy_circuit_verify" }
cairo-program-runner-lib = { path = "../../../target/proving-server/crates/cairo-program-runner-lib" }
stwo-cairo-adapter = { path = "../../../target/proving-server/crates/adapter" }
stwo-cairo-prover = { path = "../../../target/proving-server/crates/prover" }
circuit-cairo-verifier = { path = "../../../target/proving-server/crates/cairo_verifier" }
circuit-common = { path = "../../../target/proving-server/crates/circuit_common", features = ["prover"] }
circuit-prover = { path = "../../../target/proving-server/crates/circuit_prover" }
circuit-verifier = { path = "../../../target/proving-server/crates/circuit_verifier" }
circuit-serialize = { path = "../../../target/proving-server/crates/circuit_serialize" }
circuits = { path = "../../../target/proving-server/crates/circuits" }
stwo = { path = "../../../target/proving-server/crates/stwo", features = ["prover", "parallel"] }
cairo-vm = { version = "3.2.0", features = ["extensive_hints", "mod_builtin"], default-features = false }
rayon = "1"
serde_json = "1"
tempfile = "3"
zstd = "0.13"

[profile.release]
debug = false

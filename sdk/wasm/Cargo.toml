[package]
name = "templar-wasm"
description = "wasm-bindgen façade over templar-core (docs/sdk-spec.md §10.1)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
templar-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
rand_chacha = { version = "0.3", optional = true }
wasm-bindgen = "=0.2.128"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `crypto.getRandomValues` for both getrandom generations in the graph (spec §2, SDK-P11).
getrandom = { version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[features]
# Seeded exports for reproducibility tests; a separately named artifact, never released.
test-rng = ["templar-core/test-rng", "dep:rand_chacha"]

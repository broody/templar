[package]
name = "templar-core"
description = "Templar client core: keys, addresses, notes, scanning, spends and the client proof (docs/sdk-spec.md)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The reviewed R0 V4 relation and its prover, without the TMPZK002 oracle.
templar-client-verifier-circuit = { path = "../../bench/m31-private-wrapper/client-port", default-features = false }
stwo = { path = "../../target/proving-arith/crates/stwo" }
starknet-types-core = { version = "=0.2.4", default-features = false, features = ["hash", "alloc"] }
rand = { version = "=0.8.8", default-features = false, features = ["std", "std_rng"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rand_chacha = { version = "0.3", optional = true }
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
blake2 = "=0.10.6"
x25519-dalek = { version = "2", features = ["static_secrets"] }
salsa20 = "0.10"
xsalsa20poly1305 = "0.9"
chacha20poly1305 = "0.10"
f4jumble = "0.1.1"
bech32 = "0.11"
bip39 = { version = "2", default-features = false, features = ["std"] }
zeroize = { version = "1", features = ["derive"] }
ohttp = { version = "0.7", default-features = false, features = ["client", "rust-hpke"] }
bhttp = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
base64 = "0.22"

[features]
# Seeded RNGs for reproducibility tests only; never in a release artifact (spec §2, SDK-M13).
test-rng = ["dep:rand_chacha"]

[dev-dependencies]
rand_chacha = "0.3"
